name: Verify and deploy Samparka PWA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samparka-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Install, test and build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production PWA
        run: npm run build
        env:
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ secrets.VITE_GOOGLE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Verify GitHub Pages output
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs'
          const html = readFileSync('dist/index.html', 'utf8')
          const manifest = JSON.parse(readFileSync('dist/manifest.webmanifest', 'utf8'))
          if (!html.includes('/Samparka/assets/')) throw new Error('Built JS/CSS assets are not using the /Samparka/ Pages base path')
          if (manifest.start_url !== '/Samparka/' || manifest.scope !== '/Samparka/') throw new Error('PWA start_url/scope must both be /Samparka/')
          for (const icon of manifest.icons ?? []) {
            const path = `dist${icon.src.replace('/Samparka', '')}`
            if (!existsSync(path)) throw new Error(`Missing PWA icon: ${icon.src}`)
          }
          console.log('GitHub Pages paths, PWA manifest, service worker and icons verified.')
          NODE

      - name: Upload built site for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: samparka-pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: samparka-pages-dist
          path: dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
